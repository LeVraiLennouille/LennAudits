<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audit UX – Tableau de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ReadingProgress" id="rp"></div>
<nav class="TabBar" aria-label="Sections de l’audit">
<button class="Brand" data-s="dash"><img class="logo" src="assets/icon.svg" alt="" width="44" height="44"><span class="LogoTx">Lennouille</span></button>
<button class="Tab" data-s="dash">Tableau de bord</button>
<h4>Analyse UX</h4><button class="Tab" data-s="persona">Persona</button>
<h4>À propos</h4><button class="Tab" data-s="about">Profil détaillé</button>
<h4>Benchmarking</h4><button class="Tab" data-s="conc">Concurrents</button><button class="Tab" data-s="swot">Matrice SWOT</button><button class="Tab" data-s="pestel">Matrice PESTEL</button><button class="Tab" data-s="porter">Les 5 forces de Porter</button><button class="Tab" data-s="cmp">Tableau comparatif</button><button class="Tab" data-s="seo">Audit SEO</button><button class="Tab" data-s="co">Audit Contenu</button><button class="Tab" data-s="ux">Audit UX</button>
<h4>Outils annexes</h4><button class="Tab" data-s="map">Sitemap</button><button class="Tab" data-s="q">Questionnaire</button>
<div class="TabEnd"><span id="st"></span><button class="BtnSolid sm" data-p>Exporter en PDF</button><button class="Ghost" id="rst">Réinitialiser</button></div>
</nav>
<dialog id="ex" aria-labelledby="ext"><div class="ExHd"><div><span class="Eyebrow">Export</span><h2 id="ext">Exporter en PDF</h2></div><button class="Ghost" data-x="cancel" aria-label="Fermer">×</button></div>
<p class="Subtitle">Coche les éléments à inclure dans le PDF.</p>
<div class="ExBar"><button class="Ghost" id="exall" data-x="all">Tout sélectionner</button><span id="exn"></span></div>
<fieldset class="ExOr ExFm"><legend>Format de papier</legend><label class="ck"><input type="radio" name="fm" value="A3"><span>A3<small>297 × 420 mm</small></span></label><label class="ck"><input type="radio" name="fm" value="A4" checked><span>A4<small>210 × 297 mm</small></span></label><label class="ck"><input type="radio" name="fm" value="A5"><span>A5<small>148 × 210 mm</small></span></label></fieldset>
<fieldset class="ExOr"><legend>Orientation</legend><label class="ck"><input type="radio" name="or" value="p" checked><i class="Pg" aria-hidden="true"></i><span>Portrait</span></label><label class="ck"><input type="radio" name="or" value="l"><i class="Pg l" aria-hidden="true"></i><span>Paysage</span></label></fieldset>
<div id="exb"></div>
<div class="ExFt"><button class="Ghost" data-x="cancel">Annuler</button><button class="BtnSolid" id="exgo" data-x="go">Générer le PDF</button></div></dialog>
<main id="main"></main>
<script src="script.js"></script>
</body>
</html>
